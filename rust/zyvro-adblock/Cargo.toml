[package]
name = "zyvro-adblock"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
publish = false

[lib]
name = "zyvro_adblock"
crate-type = ["cdylib"]

[dependencies]
adblock = { version = "=0.13.3", default-features = false, features = ["embedded-domain-resolver", "full-regex-handling"] }
serde = "1.0"
serde_json = "1.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
